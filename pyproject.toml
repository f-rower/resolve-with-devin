[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resolve-with-devin"
version = "0.1.0"
description = "A FastAPI application that resolves issues from a GitHub repository using Devin, an AI software engineer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
